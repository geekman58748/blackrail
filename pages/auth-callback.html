<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BlackRail — Authenticating...</title>
<script src="../runtime-config.js"></script>
<style>
  body{background:#07080e;color:#f1f3f9;font-family:Inter,sans-serif;display:flex;
       align-items:center;justify-content:center;min-height:100vh;margin:0;}
  .box{text-align:center;}
  .spinner{width:40px;height:40px;border:2px solid rgba(255,255,255,0.1);
           border-top-color:#a0a3b5;border-radius:50%;
           animation:spin .8s linear infinite;margin:0 auto 20px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{margin-top:16px;font-size:13px;color:#ff5f57;max-width:320px;}
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div style="font-size:15px;font-weight:600;">Completing sign-in...</div>
  <div style="font-size:13px;color:#8c8f9f;margin-top:6px;">You'll be redirected in a moment</div>
  <div class="err" id="err" style="display:none"></div>
</div>
<script>
(function(){
  // Must match the API server's PRIVY_APP_ID env var (see index.html).
  var APP_ID   = window.BLACKRAIL_CONFIG && window.BLACKRAIL_CONFIG.privyAppId;
  var BASE     = 'https://auth.privy.io/api/v1';
  var HEADERS  = { 'Content-Type': 'application/json', 'privy-app-id': APP_ID };

  function savePrivySession(d) {
    var token = d && (d.token || d.access_token || d.session_token);
    if (token) localStorage.setItem('privy_token', token);
    return token;
  }

  var params   = new URLSearchParams(window.location.search);
  var code     = params.get('code');
  var state    = params.get('state');
  var provider = localStorage.getItem('privy_oauth_provider') || 'google';

  if (!code) {
    window.location.replace('../index.html');
    return;
  }

  fetch(BASE + '/oauth/authenticate', {
    method: 'POST',
    headers: HEADERS,
    body: JSON.stringify({ code: code, state: state, provider: provider })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (savePrivySession(d)) {
      localStorage.removeItem('privy_oauth_provider');
      var u = d.user || {};
      if (u.id) localStorage.setItem('privy_user_id', u.id);
      var accts = u.linked_accounts || [];
      var w = accts.find(function(a){ return a.type === 'wallet' && (a.wallet_client === 'privy' || a.wallet_client_type === 'privy'); });
      if (!w) w = accts.find(function(a){ return a.type === 'wallet'; });
      if (w && w.address) localStorage.setItem('privy_wallet', w.address);
      window.location.replace('dashboard.html');
    } else {
      document.getElementById('spinner').style.display = 'none';
      var el = document.getElementById('err');
      el.textContent = d.message || d.error || 'Sign-in did not return a session token.';
      el.style.display = 'block';
    }
  })
  .catch(function(e){
    document.getElementById('spinner').style.display = 'none';
    var el = document.getElementById('err');
    el.textContent = 'Network error: ' + e.message;
    el.style.display = 'block';
  });
})();
</script>
</body>
</html>
