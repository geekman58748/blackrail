<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BlackRail — Authenticating...</title>
<script src="../runtime-config.js"></script>
<style>
  body{background:#07080e;color:#f1f3f9;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{text-align:center}
  .spinner{width:40px;height:40px;border:2px solid rgba(255,255,255,0.1);border-top-color:#a0a3b5;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status{font-size:14px;color:#8c8f9f;margin-top:12px}
  .err{margin-top:16px;font-size:13px;color:#ff5f57;max-width:320px}
  .success{margin-top:16px;font-size:13px;color:#a8c4b0}
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div style="font-size:15px;font-weight:600;">Completing sign-in...</div>
  <div class="status" id="status">Verifying your magic link...</div>
  <div class="err" id="err" style="display:none"></div>
  <div class="success" id="success" style="display:none"></div>
</div>
<script>
(function() {
  const API_BASE = (window.BLACKRAIL_CONFIG?.apiBase || '').replace(/\/+$/, '');
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    showError('No token found. Please use the link from your email.');
    return;
  }

  fetch(API_BASE + '/api/auth/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token }),
  })
  .then(r => r.json().then(data => ({ ok: r.ok, data })))
  .then(({ ok, data }) => {
    if (!ok) throw new Error(data.error || 'Verification failed');

    // Store session
    localStorage.setItem('blackrail_session_token', data.sessionToken);
    localStorage.setItem('blackrail_user_id', String(data.user.id));
    localStorage.setItem('blackrail_user_email', data.user.email);
    localStorage.setItem('blackrail_wallet_address', data.wallet.publicKey);

    // Clear any old Privy stuff
    localStorage.removeItem('privy_token');
    localStorage.removeItem('privy_user_id');
    localStorage.removeItem('privy_wallet');
    localStorage.removeItem('privy_oauth_provider');
    localStorage.removeItem('blackrail_api_key');
    localStorage.removeItem('blackrail_merchant_id');

    showSuccess('Signed in! Redirecting...');

    setTimeout(() => {
      window.location.replace('dashboard.html');
    }, 800);
  })
  .catch(e => {
    showError(e.message || 'Sign-in failed. Please try again.');
  });

  function showError(msg) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('err').textContent = msg;
    document.getElementById('err').style.display = 'block';
  }

  function showSuccess(msg) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('success').textContent = msg;
    document.getElementById('success').style.display = 'block';
  }
})();
</script>
</body>
</html>
